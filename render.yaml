services:
  - type: web
    name: lortpoc-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://lortpoc.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: guidePoc
      - key: REDIS_URL
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_CACHE_TTL
        value: "86400"
      - key: SEARCH_CACHE_TTL
        value: "3600"
      - key: LOG_LEVEL
        value: http
