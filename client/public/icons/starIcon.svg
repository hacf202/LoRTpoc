<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFA500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="starBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#starGlow)"/>

  <!-- Star Shape -->
  <polygon points="32,4 40.5,22.2 60.5,24.6 45.7,38.3 49.7,58 32,48.2 14.3,58 18.3,38.3 3.5,24.6 23.5,22.2"
    fill="url(#starGold)"
    stroke="url(#starBorder)"
    stroke-width="1.8"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Core Sparkle Highlight -->
  <polygon points="32,10 37.5,23.5 52,25.3 41,35.5 44,50 32,42.5 20,50 23,35.5 12,25.3 26.5,23.5"
    fill="#FFFFFF"
    opacity="0.25"/>

  <!-- Center Diamond Sparkle -->
  <path d="M32 20 L35 32 L47 32 L37 38 L40 50 L32 43 L24 50 L27 38 L17 32 L29 32 Z" fill="#FFE57F" opacity="0.35"/>
</svg>
